# Example deployment config for the RFS v3 forecast (orchestration branch).
#
# Copy to "config.yaml" (kept out of version control), fill in the Atos values,
# then deploy with:
#
#     gdeploy --config /path/to/config.yaml
#
# Plain data: every value is a literal. "%SCHOST:ab%" is an ecFlow variable
# passed through verbatim; "{includes}"/"{scripts}" are sdeploy placeholders.
# This config drives builder_v3 (the core v3 tree), not the v2 builder.

name: geoglows_v3
mode: test                 # 'test' or 'prod'
first_date: "YYYYMMDD"
last_date: "YYYYMMDD"      # optional; defaults far in the future
cycles: ["00"]             # daily cycles to run; download_ifs.sh is 00Z-oriented

# RFS v3 data locations on Atos (routing/ + hydrography/ staged from the bucket).
routing: /path/to/routing            # routing/ (uses global/ O1280 weights)
hydrography: /path/to/hydrography
forecasts: /path/to/forecasts        # out-root for discharge.zarr
forecast_workroot: /path/to/workroot # per-cycle work dir root (per-member netCDF)
forecast_threads: 4                  # river-route routing threads
forecast_jobs: 4                     # discharge_zarr aggregation jobs

# Templated into suite.h / mars.h by the shared includes.
expver: geoglows
exparch: /path/to/archive
iniexparch: /path/to/init_archive
staticdata: /path/to/assets
workroot: /path/to/suite_workroot    # suite_dir; build_venv installs under lib/

# Suite source code.
source:
  root: /path/to/source
  builder: geoglows_ecflow.workflow.builders.builder_v3
script_extension: ".ecf"

# Deploy location (the fresh v3 ecflow server's DEFDIR).
target:
  root: /path/to/deploy_location

# Where to run computations.
jobs:
  manager:
    name: troika
  root: /path/to/job_root            # ECF_HOME on the v3 server
  limit: 4                           # max concurrent 'main' tasks
  destinations:
    default:
      host: "%SCHOST:ab%"
      user: user_name
      queue: nf
      account: ECACCOUNT
      sthost: sthost
